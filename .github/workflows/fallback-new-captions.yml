name: Independent caption fallback for new Last Days videos

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - ".github/workflows/fallback-new-captions.yml"

permissions:
  contents: write

jobs:
  fallback:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install alternative caption client
        run: python -m pip install youtube-transcript-api
      - name: Fetch missing timestamped subtitles via transcript endpoint
        run: python scripts/fetch_missing_captions.py URyAOyKCTdc:corpus W7v5YD2SAn8:corpus-streams
      - name: Commit successfully retrieved captions
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add corpus/ corpus-streams/
          if ! git diff --cached --quiet; then
            git commit -m "Add captioned Nov 2026 Last Days videos from public transcript endpoint"
            git pull --rebase origin master
            git push origin HEAD:master
          else
            echo "No new captions recovered via public transcript endpoint."
          fi
