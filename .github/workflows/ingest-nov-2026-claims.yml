name: Ingest source-reviewed Nov 2026 Biggs claims
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - ".github/workflows/ingest-nov-2026-claims.yml"
      - "mentions-new-live-2026-11-02.json"
      - "reviews-new-live-2026-11-03.json"
      - "prophecy.py"
permissions:
  contents: write
concurrency:
  group: biggs-prophecy-db-update
  cancel-in-progress: false
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify existing LFS-backed longitudinal database
        shell: bash
        run: |
          git lfs pull
          python - <<'PY'
          import sqlite3,os
          p="prophecy.db"
          if os.path.getsize(p) < 1000000:
              raise SystemExit("STOP: LFS DB not materialized; refusing to create a fresh DB")
          con=sqlite3.connect(p)
          n=con.execute("SELECT COUNT(*) FROM video").fetchone()[0]
          if n < 550:
              raise SystemExit(f"STOP: existing video count only {n}; refusing to overwrite DB")
          print("Existing videos before current import:",n)
          PY
      - name: Ingest only previously unseen transcript videos, then classify
        shell: bash
        run: |
          python - <<'PY'
          import sqlite3,re,shutil
          from pathlib import Path
          con=sqlite3.connect("prophecy.db")
          existing={row[0] for row in con.execute("SELECT video_id FROM video")}
          pattern=re.compile(r"\[([A-Za-z0-9_-]{11})\]\.txt$")
          for folder in ("corpus","corpus-streams"):
              src=Path(folder)
              dst=Path("/tmp/new-biggs-corpus")/folder
              dst.mkdir(parents=True,exist_ok=True)
              pending=set()
              for p in src.glob("*.txt"):
                  m=pattern.search(p.name)
                  if not m or m.group(1) in existing:
                      continue
                  shutil.copy2(p,dst/p.name)
                  pending.add(m.group(1))
              original=src/"manifest.tsv"
              if pending and original.exists():
                  lines=original.read_text(encoding="utf-8-sig").splitlines()
                  selected=[line for i,line in enumerate(lines)
                            if i==0 or line.split("\t",1)[0] in pending]
                  (dst/"manifest.tsv").write_text("\n".join(selected)+"\n",encoding="utf-8")
              print(folder, "unseen videos:", sorted(pending))
          PY
          for folder in corpus corpus-streams; do
            if find "/tmp/new-biggs-corpus/$folder" -maxdepth 1 -name '*.txt' | grep -q .; then
              python prophecy.py ingest "/tmp/new-biggs-corpus/$folder"
            else
              echo "No unseen $folder videos; preserve existing immutable segments."
            fi
          done
          python prophecy.py type
      - name: Add only source-grounded mentions missing from DB
        shell: bash
        run: |
          python - <<'PY'
          import sqlite3,json,hashlib
          p="mentions-new-live-2026-11-02.json"
          d=json.load(open(p,encoding="utf-8"))
          con=sqlite3.connect("prophecy.db")
          tool="source-reviewed-nov2026"
          version="v2"
          missing=[]
          for m in d["mentions"]:
              v=con.execute("SELECT uploaded_on FROM video WHERE video_id=?",(m["video_id"],)).fetchone()
              if not v or not v[0]:
                  raise SystemExit(f"STOP: missing ingested and dated video {m['video_id']}")
              mid=hashlib.sha256(f"{m['video_id']}|{int(m['start_s'])}|{m['claim_text']}|{tool}|{version}".encode()).hexdigest()[:16]
              if con.execute("SELECT 1 FROM mention WHERE mention_id=?",(mid,)).fetchone():
                  continue
              if not m.get("falsify_match") or not m.get("falsify_miss"):
                  raise SystemExit(f"STOP: no precommitted falsifiers at {m['start_s']}")
              missing.append(m)
          json.dump({"mentions":missing},open("/tmp/new-biggs-mentions.json","w",encoding="utf-8"),ensure_ascii=False,indent=2)
          print(f"New mentions to load: {len(missing)}")
          PY
          if python -c "import json,sys;sys.exit(0 if len(json.load(open('/tmp/new-biggs-mentions.json'))['mentions']) else 1)"; then
            python prophecy.py load /tmp/new-biggs-mentions.json --tool source-reviewed-nov2026 --prompt-version v2
          else
            echo "All current source-grounded mention IDs already loaded; skipping idempotently."
          fi
      - name: Reconcile known canonical identities, preserve uncertainty
        run: |
          python prophecy.py cluster
          python prophecy.py review reviews-new-live-2026-11-03.json --tool source-review --prompt-version v2
          python prophecy.py validate
          python prophecy.py todo --limit 10
          python prophecy.py stats
      - name: Persist audit and updated LFS database
        shell: bash
        run: |
          python - <<'PY'
          import sqlite3,datetime,pathlib
          con=sqlite3.connect("prophecy.db")
          ids=["W7v5YD2SAn8","URyAOyKCTdc"]
          rows=con.execute("SELECT video_id,COUNT(*) FROM mention WHERE video_id IN (?,?) GROUP BY video_id",ids).fetchall()
          lines=["# Nov 2026 claim-graph ingest status","",
                 "Generated by GitHub Actions from the actual existing LFS database. This confirms source ingest and mention rows, not prediction verification.","",
                 f"UTC run date: {datetime.datetime.now(datetime.timezone.utc).isoformat()}",""]
          for vid,n in rows:lines.append(f"- {vid}: {n} total mentions from all extractors")
          orphaned=con.execute("SELECT COUNT(DISTINCT a.claim_id) FROM assignment a LEFT JOIN canonical_claim c ON c.claim_id=a.claim_id WHERE a.claim_id IS NOT NULL AND c.claim_id IS NULL").fetchone()[0]
          lines.append(f"- Prior dangling canonical assignments retained for audit (skipped by mechanical validation): {orphaned}")
          lines += ["","Known existing events reviewed: Senate blue 2026, House red 2026, Byron Donalds Florida, Russia/Poland. Uncertain Italy and 1929 branches remain unmerged.","",
                    "No US midterm election outcome was independently scored by this job.",
                    "Additional previously discovered video OU3zNmq_QaY remains pending raw timestamps.",""]
          f=pathlib.Path("exports/research/2026-11-03-latest-claims-ingest.md")
          f.parent.mkdir(parents=True,exist_ok=True)
          f.write_text("\n".join(lines),encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prophecy.db exports/research/2026-11-03-latest-claims-ingest.md
          if ! git diff --cached --quiet; then
            git commit -m "Ingest and review Nov 2026 timestamped Biggs claims in canonical graph"
            git pull --rebase origin master
            git push origin HEAD:master
          else
            echo "No database or report changes."
          fi
